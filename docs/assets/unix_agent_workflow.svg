<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="100%" height="100%">
  <defs>
    <!-- Material Elevation Shadows -->
    <filter id="elevation-1" x="-10%" y="-10%" width="120%" height="125%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="elevation-2" x="-10%" y="-10%" width="120%" height="125%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8AB4F8"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282A2E"/>
      <stop offset="100%" stop-color="#1E1F22"/>
    </linearGradient>
    <linearGradient id="agent-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30343D"/>
      <stop offset="100%" stop-color="#202227"/>
    </linearGradient>

    <!-- CSS Animation Styles -->
    <style>
      @keyframes dash {
        to {
          stroke-dashoffset: -40;
        }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px #8AB4F8); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #8AB4F8); }
      }
      @keyframes badge-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      @keyframes flow-reverse {
        to {
          stroke-dashoffset: 40;
        }
      }
      .pipeline-line {
        stroke: #8AB4F8;
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
        animation: dash 1.5s linear infinite;
      }
      .feedback-line {
        stroke: #81C995;
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
        animation: flow-reverse 1.5s linear infinite;
      }
      .cache-line {
        stroke: #FDD663;
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
        animation: dash 1.8s linear infinite;
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite;
      }
      .text-title {
        font-family: 'Google Sans', Roboto, -apple-system, sans-serif;
        font-weight: 700;
        fill: #E8EAED;
      }
      .text-sub {
        font-family: Roboto, -apple-system, sans-serif;
        font-weight: 400;
        fill: #9AA0A6;
      }
      .text-code {
        font-family: 'Roboto Mono', Menlo, monospace;
        font-weight: 500;
      }
      .badge-text {
        font-family: 'Google Sans', Roboto, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1060" height="760" fill="#131314" rx="16"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.06">
    <path d="M 0,40 H 1060 M 0,80 H 1060 M 0,120 H 1060 M 0,160 H 1060 M 0,200 H 1060 M 0,240 H 1060 M 0,280 H 1060 M 0,320 H 1060 M 0,360 H 1060 M 0,400 H 1060 M 0,440 H 1060 M 0,480 H 1060 M 0,520 H 1060 M 0,560 H 1060 M 0,600 H 1060 M 0,640 H 1060 M 0,680 H 1060 M 0,720 H 1060" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M 40,0 V 760 M 80,0 V 760 M 120,0 V 760 M 160,0 V 760 M 200,0 V 760 M 240,0 V 760 M 280,0 V 760 M 320,0 V 760 M 360,0 V 760 M 400,0 V 760 M 440,0 V 760 M 480,0 V 760 M 520,0 V 760 M 560,0 V 760 M 600,0 V 760 M 640,0 V 760 M 680,0 V 760 M 720,0 V 760 M 760,0 V 760 M 800,0 V 760 M 840,0 V 760 M 880,0 V 760 M 920,0 V 760 M 960,0 V 760 M 1000,0 V 760" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 36)">
    <rect width="980" height="74" rx="12" fill="#1E1F22" stroke="#3C4043" stroke-width="1" filter="url(#elevation-1)"/>
    <circle cx="36" cy="37" r="18" fill="#8AB4F8" fill-opacity="0.15"/>
    <path d="M 28,37 L 34,43 L 45,31" fill="none" stroke="#8AB4F8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="68" y="32" class="text-title" font-size="19" fill="#E8EAED">UNIX PHILOSOPHY AI AGENT PIPELINE</text>
    <text x="68" y="52" class="text-sub" font-size="13">Composable Deterministic Toolchain • Zero MCP Schema Tax • Strict Context Boundaries</text>

    <!-- Metrics Badges -->
    <g transform="translate(680, 20)">
      <rect width="135" height="34" rx="17" fill="#81C995" fill-opacity="0.15" stroke="#81C995" stroke-width="1.2"/>
      <text x="67" y="21" text-anchor="middle" class="badge-text" fill="#81C995">&gt;95% TOKEN CUT</text>
    </g>
    <g transform="translate(825, 20)">
      <rect width="135" height="34" rx="17" fill="#8AB4F8" fill-opacity="0.15" stroke="#8AB4F8" stroke-width="1.2"/>
      <text x="67" y="21" text-anchor="middle" class="badge-text" fill="#8AB4F8">ZERO SCHEMA TAX</text>
    </g>
  </g>

  <!-- Connectors / Pipelines (Behind Cards) -->
  <!-- 1. Spec to Agent -->
  <path d="M 190,260 L 190,320 L 530,320 L 530,370" fill="none" class="pipeline-line"/>
  
  <!-- 2. Topology (graph_fy) to Agent -->
  <path d="M 530,260 L 530,370" fill="none" class="pipeline-line"/>

  <!-- 3. Worktree to Agent -->
  <path d="M 870,260 L 870,320 L 530,320" fill="none" class="pipeline-line"/>

  <!-- 4. Agent to AST & Grep -->
  <path d="M 440,490 L 440,550 L 260,550 L 260,570" fill="none" class="pipeline-line"/>

  <!-- 5. Agent to Deterministic Feedback (just/ruff) -->
  <path d="M 530,490 L 530,570" fill="none" class="feedback-line"/>

  <!-- 6. Agent to Cache & Proxy (Headroom) -->
  <path d="M 620,490 L 620,550 L 800,550 L 800,570" fill="none" class="cache-line"/>

  <!-- Return Loop: Deterministic test back to Spec/Invariants -->
  <path d="M 170,640 L 90,640 L 90,200 L 105,200" fill="none" class="feedback-line" opacity="0.6"/>

  <!-- ==================== ROW 1: INPUTS & BOUNDARIES ==================== -->

  <!-- Card 1: Spec-Driven Domain Contract -->
  <g transform="translate(40, 130)">
    <rect width="300" height="130" rx="12" fill="url(#card-surface)" stroke="#3C4043" stroke-width="1.2" filter="url(#elevation-1)"/>
    <rect width="300" height="4" rx="2" fill="#D7AEFB"/>
    <text x="20" y="32" class="text-title" font-size="14" fill="#D7AEFB">1. SPEC &amp; INVARIANTS</text>
    <text x="20" y="52" class="text-sub" font-size="12">Domain-Driven Contract &amp; Guardrails</text>
    
    <g transform="translate(20, 68)">
      <rect width="260" height="46" rx="6" fill="#131314" stroke="#2B2D31" stroke-width="1"/>
      <text x="12" y="19" class="text-code" font-size="11" fill="#D7AEFB">spec.md</text>
      <text x="65" y="19" class="text-sub" font-size="11">→ What/Why &amp; Invariants</text>
      <text x="12" y="36" class="text-code" font-size="11" fill="#8AB4F8">ADR-00X</text>
      <text x="65" y="36" class="text-sub" font-size="11">→ Architectural Rationale</text>
    </g>
  </g>

  <!-- Card 2: graph_fy Topology & Blast Radius -->
  <g transform="translate(380, 130)">
    <rect width="300" height="130" rx="12" fill="url(#card-surface)" stroke="#8AB4F8" stroke-width="1.8" filter="url(#elevation-2)" class="node-pulse"/>
    <rect width="300" height="4" rx="2" fill="#8AB4F8"/>
    <text x="20" y="32" class="text-title" font-size="14" fill="#8AB4F8">2. TOPOLOGY &amp; BLAST RADIUS</text>
    <text x="20" y="52" class="text-sub" font-size="12">Zero-LLM Subsystem Classification</text>
    
    <g transform="translate(20, 68)">
      <rect width="260" height="46" rx="6" fill="#131314" stroke="#2B2D31" stroke-width="1"/>
      <text x="12" y="19" class="text-code" font-size="11" fill="#8AB4F8">graph_fy context "&lt;task&gt;"</text>
      <text x="12" y="36" class="text-sub" font-size="10.5" fill="#81C995">✓ AST Skeletons  ✓ God Nodes  ✓ Blast Tier</text>
    </g>
  </g>

  <!-- Card 3: Filesystem Isolation (git worktree) -->
  <g transform="translate(720, 130)">
    <rect width="300" height="130" rx="12" fill="url(#card-surface)" stroke="#3C4043" stroke-width="1.2" filter="url(#elevation-1)"/>
    <rect width="300" height="4" rx="2" fill="#FDD663"/>
    <text x="20" y="32" class="text-title" font-size="14" fill="#FDD663">3. ISOLATED WORKTREE</text>
    <text x="20" y="52" class="text-sub" font-size="12">Parallel Sandbox • No Branch Clashing</text>
    
    <g transform="translate(20, 68)">
      <rect width="260" height="46" rx="6" fill="#131314" stroke="#2B2D31" stroke-width="1"/>
      <text x="12" y="19" class="text-code" font-size="10" fill="#FDD663">git worktree add ../.wt/task</text>
      <text x="12" y="36" class="text-sub" font-size="11" fill="#9AA0A6">Dedicated Port &amp; Isolated State</text>
    </g>
  </g>

  <!-- ==================== CENTER: THE AI AGENT / ORCHESTRATOR ==================== -->

  <g transform="translate(260, 360)">
    <rect width="540" height="130" rx="16" fill="url(#agent-surface)" stroke="#8AB4F8" stroke-width="2" filter="url(#elevation-2)"/>
    
    <!-- Header inside Orchestrator -->
    <g transform="translate(24, 20)">
      <circle cx="16" cy="16" r="14" fill="#8AB4F8" fill-opacity="0.2"/>
      <path d="M 10,16 L 15,21 L 22,11" fill="none" stroke="#8AB4F8" stroke-width="2.5" stroke-linecap="round"/>
      <text x="42" y="16" class="text-title" font-size="16" fill="#E8EAED">AI AGENT / ORCHESTRATOR</text>
      <text x="42" y="32" class="text-sub" font-size="12">Claude Code • Antigravity • Cursor (Operating via Unix Shell)</text>
    </g>

    <!-- Operational Rules Grid -->
    <g transform="translate(24, 66)">
      <rect width="155" height="44" rx="8" fill="#1E1F22" stroke="#3C4043" stroke-width="1"/>
      <text x="12" y="18" class="badge-text" fill="#8AB4F8">CAVEMAN MODE</text>
      <text x="12" y="33" class="text-sub" font-size="10">Terse, high-signal</text>

      <g transform="translate(167, 0)">
        <rect width="155" height="44" rx="8" fill="#1E1F22" stroke="#3C4043" stroke-width="1"/>
        <text x="12" y="18" class="badge-text" fill="#81C995">PONYTAIL RULE</text>
        <text x="12" y="33" class="text-sub" font-size="10">YAGNI &amp; stdlib first</text>
      </g>

      <g transform="translate(334, 0)">
        <rect width="155" height="44" rx="8" fill="#1E1F22" stroke="#3C4043" stroke-width="1"/>
        <text x="12" y="18" class="badge-text" fill="#F28B82">NO GIT OPS</text>
        <text x="12" y="33" class="text-sub" font-size="10">No checkout / switch</text>
      </g>
    </g>
  </g>

  <!-- ==================== ROW 3: SHARP DETERMINISTIC TOOLS ==================== -->

  <!-- Tool 1: Structural AST & Fast Grep -->
  <g transform="translate(40, 570)">
    <rect width="300" height="145" rx="12" fill="url(#card-surface)" stroke="#3C4043" stroke-width="1.2" filter="url(#elevation-1)"/>
    <rect width="300" height="4" rx="2" fill="#78D9EC"/>
    <text x="20" y="28" class="text-title" font-size="13.5" fill="#78D9EC">4. STRUCTURAL &amp; LEXICAL</text>
    <text x="20" y="46" class="text-sub" font-size="11">Syntax AST search + Instant String Scan</text>

    <g transform="translate(16, 58)">
      <rect width="268" height="72" rx="6" fill="#131314" stroke="#2B2D31" stroke-width="1"/>
      <text x="10" y="20" class="text-code" font-size="10" fill="#78D9EC">ast-grep -p '$CLASS { $$$ }'</text>
      <text x="10" y="38" class="text-code" font-size="10" fill="#8AB4F8">rg 'CONFIG_KEY' -g '!tests'</text>
      <text x="10" y="58" class="text-sub" font-size="10.5" fill="#81C995">✓ Zero hallucinations  ✓ AST rewrites</text>
    </g>
  </g>

  <!-- Tool 2: Deterministic Feedback & Contract -->
  <g transform="translate(380, 570)">
    <rect width="300" height="145" rx="12" fill="url(#card-surface)" stroke="#81C995" stroke-width="1.5" filter="url(#elevation-1)"/>
    <rect width="300" height="4" rx="2" fill="#81C995"/>
    <text x="20" y="28" class="text-title" font-size="13.5" fill="#81C995">5. ZERO-$ VERIFICATION</text>
    <text x="20" y="46" class="text-sub" font-size="11">Deterministic Linters &amp; Single Contracts</text>

    <g transform="translate(16, 58)">
      <rect width="268" height="72" rx="6" fill="#131314" stroke="#2B2D31" stroke-width="1"/>
      <text x="10" y="20" class="text-code" font-size="10" fill="#81C995">just test &amp;&amp; just lint</text>
      <text x="10" y="38" class="text-code" font-size="10" fill="#9AA0A6">ruff check | biome check | tsc</text>
      <text x="10" y="58" class="text-sub" font-size="10.5" fill="#FDD663">⚡ Catches 90% bugs with 0 tokens</text>
    </g>
  </g>

  <!-- Tool 3: Cache Defense & Output Slicing -->
  <g transform="translate(720, 570)">
    <rect width="300" height="145" rx="12" fill="url(#card-surface)" stroke="#3C4043" stroke-width="1.2" filter="url(#elevation-1)"/>
    <rect width="300" height="4" rx="2" fill="#FDD663"/>
    <text x="20" y="28" class="text-title" font-size="13.5" fill="#FDD663">6. CACHE DEFENSE &amp; SLICING</text>
    <text x="20" y="46" class="text-sub" font-size="11">Log Muting &amp; Prompt Cache Freezing</text>

    <g transform="translate(16, 58)">
      <rect width="268" height="72" rx="6" fill="#131314" stroke="#2B2D31" stroke-width="1"/>
      <text x="10" y="20" class="text-code" font-size="10" fill="#FDD663">headroom run -- claude</text>
      <text x="10" y="38" class="text-code" font-size="10" fill="#9AA0A6">cmd | jq '...' | tail -n 25</text>
      <text x="10" y="58" class="text-sub" font-size="10.5" fill="#8AB4F8">✓ 90% cache hit rate  ✓ No log dumps</text>
    </g>
  </g>

  <!-- Pulse Circles (Moving Packets) -->
  <circle cx="530" cy="320" r="4" fill="#8AB4F8">
    <animate attributeName="cy" values="260;370" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="530" cy="530" r="4" fill="#81C995">
    <animate attributeName="cy" values="490;570" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="550" r="4" fill="#78D9EC">
    <animate attributeName="cx" values="440;260" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="550" r="4" fill="#FDD663">
    <animate attributeName="cx" values="620;800" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
