name: Upstream Fork Sync & Drift Detection

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-upstream-sync:
    name: Check Upstream Graphify Divergence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure upstream remote
        run: |
          git remote add upstream https://github.com/safouanechergui/graphify.git || git remote set-url upstream https://github.com/safouanechergui/graphify.git
          git fetch upstream main --tags

      - name: Detect Upstream Drift
        id: drift
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD upstream/main || true)

          echo "upstream_head=${UPSTREAM_HEAD}" >> $GITHUB_OUTPUT
          echo "merge_base=${MERGE_BASE}" >> $GITHUB_OUTPUT

          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "behind_count=${BEHIND_COUNT}" >> $GITHUB_OUTPUT
          echo "Upstream is ${BEHIND_COUNT} commit(s) ahead of current branch merge-base."

          if [ "${BEHIND_COUNT}" -gt 0 ]; then
            echo "has_drift=true" >> $GITHUB_OUTPUT
            echo "### Upstream Commits Pending Sync" > upstream_diff_summary.md
            git log --oneline --no-merges HEAD..upstream/main | head -n 30 >> upstream_diff_summary.md
          else
            echo "has_drift=false" >> $GITHUB_OUTPUT
          fi

      - name: Report Upstream Drift
        if: steps.drift.outputs.has_drift == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('upstream_diff_summary.md') 
              ? fs.readFileSync('upstream_diff_summary.md', 'utf8') 
              : 'New commits detected in upstream repository.';
            
            const title = `[Upstream Sync Alert] ${steps.drift.outputs.behind_count} new commit(s) on safouanechergui/graphify`;
            const body = `Automated upstream tracking detected new commits on \`upstream/main\`.\n\n${summary}\n\n### Sync Instructions\n\`\`\`bash\ngit fetch upstream main\ngit checkout -b sync/upstream-main\ngit merge upstream/main\n# Resolve any conflicts strictly in core extractors\npytest\n\`\`\``;
            
            // Search for existing open issue with this title prefix
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['upstream-sync']
            });

            if (issues.data.length > 0) {
              console.log(`Updating existing tracking issue #${issues.data[0].number}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                title: title,
                body: body
              });
            } else {
              console.log('Creating new tracking issue');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['upstream-sync']
              });
            }
