name: Knowledge Graph & Skill Evaluation Benchmark

on:
  push:
    branches: [main, master, perf/*, feat/*, fix/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark-and-eval:
    name: Run Skill Benchmark & Blast Radius Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Core Evaluation Tests
        run: |
          pytest tests/test_evals.py tests/test_multi_repo.py tests/test_cli_diff_pr.py -v

      - name: Build Knowledge Graph
        run: |
          python -m graph_fy.cli . --no-viz

      - name: Execute 53 Real-World Scenario Evaluation Suite
        run: |
          python -m graph_fy.cli eval --scenarios evals/real_world_scenarios.json

      - name: Generate PR Blast Radius Analysis
        if: github.event_name == 'pull_request'
        run: |
          python -m graph_fy.cli diff --github-pr origin/${{ github.base_ref }} > pr_blast_radius.md
          cat pr_blast_radius.md
